$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Message
status: stable
description: A status message shown to the user, such as a confirmation or an error.
props:
  type: object
  properties:
    type:
      type: string
      title: Type
      enum: [status, warning, error]
      default: status
    label:
      type: string
      title: Accessible label
      description: Names the kind of message for screen readers.
slots:
  content:
    title: Message
