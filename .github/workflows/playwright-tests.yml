name: Playwright Tests

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday midnight

jobs:
  playwright_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Setup resticprofile
        uses: axelerant/setup-resticprofile-action@v1

      - name: Start DDEV
        run: ddev start

      - name: Install dependencies
        env:
          ASSETS_AWS_ACCESS_KEY_ID: ${{ secrets.ASSETS_AWS_ACCESS_KEY_ID }}
          ASSETS_AWS_SECRET_ACCESS_KEY: ${{ secrets.ASSETS_AWS_SECRET_ACCESS_KEY }}
        run: |
          ddev composer install
          resticprofile ddev.restore latest

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'test/playwright/package-lock.json'

      - name: Install Playwright
        run: |
          cd test/playwright
          npm ci --prefer-offline --no-audit
          npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
          cd test/playwright
          npm run test

      - name: Save playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test/playwright/playwright-report
            test/playwright/tests/visual
          retention-days: 3
