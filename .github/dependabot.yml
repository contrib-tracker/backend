version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Composer"
      include: "scope"
    versioning-strategy: increase-if-necessary
    groups:
      drupal-core:
        patterns:
          - "drupal/core*"
      drupal-projects:
        patterns:
          - "drupal/*"
        exclude-patterns:
          - "drupal/core*"
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "npm"
    directory: "/web/themes/custom/ct/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "npm"
    groups:
      vite-plus:
        patterns:
          - "vite-plus"
          - "vite"
          - "vitest"
      types:
        patterns:
          - "@types/*"
      stylelint:
        patterns:
          - "stylelint*"
